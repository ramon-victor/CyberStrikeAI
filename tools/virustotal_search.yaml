name: "virustotal_search"
command: "python3"
args:
  - "-c"
  - |
    import sys
    import json
    import requests
    import os
    import time

    # ==================== VirusTotal Configuration ====================
    # Configure your VirusTotal API key here
    # You can also set it in the environment variable: VT_API_KEY
    # enabled defaults to false and must be enabled before this MCP can be called
    VT_API_KEY = ""  # Enter your VirusTotal API key
    # =======================================================

    # VirusTotal API base URL
    BASE_URL = "https://www.virustotal.com/api/v3"

    def parse_args():
        """Parse command-line arguments"""
        # Try to read JSON configuration from the first argument
        if len(sys.argv) > 1:
            try:
                arg1 = str(sys.argv[1])
                config = json.loads(arg1)
                if isinstance(config, dict):
                    return config
            except (json.JSONDecodeError, TypeError, ValueError):
                pass

        # Legacy positional argument format
        config = {}
        if len(sys.argv) > 1:
            config['domain'] = str(sys.argv[1])
        if len(sys.argv) > 2:
            try:
                config['limit'] = int(sys.argv[2])
            except (ValueError, TypeError):
                pass
        if len(sys.argv) > 3:
            config['include_ips'] = sys.argv[3].lower() in ('true', '1', 'yes')
        return config

    def query_virustotal_subdomains(domain, api_key, limit=100, include_ips=False):
        """
        Query VirusTotal for subdomain information
        
        Args:
            domain: Domain to query
            api_key: VirusTotal API key
            limit: Maximum number of results to return
            include_ips: Whether to include IP address information
        
        Returns:
            dict: Dictionary containing query results
        """
        # Build the API request URL
        url = f"{BASE_URL}/domains/{domain}/subdomains"
        
        headers = {
            "x-apikey": api_key,
            "accept": "application/json"
        }
        
        params = {
            "limit": min(limit, 40)  # API maximum is 40
        }
        
        all_results = []
        next_url = None
        
        try:
            # Handle pagination
            while True:
                if next_url:
                    response = requests.get(next_url, headers=headers, timeout=30)
                else:
                    response = requests.get(url, headers=headers, params=params, timeout=30)
                
                response.raise_for_status()
                data = response.json()
                
                # Extract subdomain data
                if 'data' in data and data['data']:
                    for item in data['data']:
                        if 'id' in item:
                            subdomain_info = {
                                'subdomain': item['id'],
                                'type': item.get('type', 'domain'),
                            }
                            
                            # If include_ips is True, try to obtain resolved IPs
                            if include_ips and 'attributes' in item:
                                attributes = item.get('attributes', {})
                                # This handling is simplified; additional API calls may actually be required
                                subdomain_info['last_dns_records'] = attributes.get('last_dns_records', [])
                            
                            all_results.append(subdomain_info)
                    
                    # Check whether another page is available
                    if 'links' in data and 'next' in data['links'] and len(all_results) < limit:
                        next_url = data['links']['next']
                        # Avoid sending requests too quickly
                        time.sleep(0.5)
                    else:
                        break
                else:
                    break
                
                # Stop fetching once the limit is reached
                if len(all_results) >= limit:
                    break
            
            # Process returned results
            if all_results:
                return {
                    "status": "success",
                    "domain": domain,
                    "total_found": len(all_results),
                    "results": all_results[:limit],
                    "message": f"Successfully retrieved {len(all_results[:limit])} subdomains"
                }
            else:
                return {
                    "status": "success",
                    "domain": domain,
                    "total_found": 0,
                    "results": [],
                    "message": f"No subdomains found for {domain}"
                }
                
        except requests.exceptions.RequestException as e:
            error_msg = str(e)
            error_result = {
                "status": "error",
                "message": f"API request failed: {error_msg}",
                "suggestion": "Check the network connection, verify the API key, and confirm that the VirusTotal API service is available"
            }
            
            # Handle specific HTTP status codes
            if hasattr(e, 'response') and e.response:
                status_code = e.response.status_code
                if status_code == 401:
                    error_result["message"] = "API key is invalid or unauthorized"
                    error_result["suggestion"] = "Check that the VirusTotal API key is correct, or obtain a valid key at https://www.virustotal.com/"
                elif status_code == 429:
                    error_result["message"] = "API request rate limit exceeded"
                    error_result["suggestion"] = "Try again later; the VirusTotal API has strict rate limits (4 requests per minute on the free tier)"
                elif status_code == 404:
                    error_result["message"] = f"Domain '{domain}' does not exist or was not found"
            
            return error_result

    try:
        config = parse_args()
        
        if not isinstance(config, dict):
            error_result = {
                "status": "error",
                "message": f"Argument parsing error: expected a dictionary, got {type(config).__name__}",
                "type": "TypeError"
            }
            print(json.dumps(error_result, ensure_ascii=False, indent=2))
            sys.exit(1)
        
        # Get the API key (from configuration or the environment)
        api_key = os.getenv('VT_API_KEY', VT_API_KEY).strip()
        
        if not api_key:
            error_result = {
                "status": "error",
                "message": "Missing VirusTotal API key",
                "required_config": ["VT_API_KEY"],
                "note": "Enter your VirusTotal API key in the VT_API_KEY setting in the YAML file, or set the VT_API_KEY environment variable. Register for an API key at https://www.virustotal.com/"
            }
            print(json.dumps(error_result, ensure_ascii=False, indent=2))
            sys.exit(1)
        
        # Get required parameters
        domain = config.get('domain', '').strip()
        if not domain:
            error_result = {
                "status": "error",
                "message": "Missing required parameter: domain (domain to query)",
                "required_params": ["domain"],
                "examples": [
                    "example.com",
                    "google.com",
                    "baidu.com"
                ]
            }
            print(json.dumps(error_result, ensure_ascii=False, indent=2))
            sys.exit(1)
        
        # Get optional parameters
        limit = config.get('limit', 100)
        try:
            limit = int(limit)
            if limit < 1:
                limit = 100
            elif limit > 1000:
                limit = 1000  # Maximum limit: 1000
        except (ValueError, TypeError):
            limit = 100
        
        include_ips = config.get('include_ips', False)
        if isinstance(include_ips, str):
            include_ips = include_ips.lower() in ('true', '1', 'yes')
        
        # Execute query
        result = query_virustotal_subdomains(domain, api_key, limit, include_ips)
        
        # Output results
        print(json.dumps(result, ensure_ascii=False, indent=2))
        
    except Exception as e:
        error_result = {
            "status": "error",
            "message": f"Execution error: {str(e)}",
            "type": type(e).__name__
        }
        print(json.dumps(error_result, ensure_ascii=False, indent=2))
        sys.exit(1)

enabled: false

short_description: "VirusTotal subdomain query tool for passive subdomain collection via the VirusTotal API"

description: |
  VirusTotal subdomain query tool that discovers subdomains of a target domain using historical DNS data aggregated by VirusTotal.
  
  **Key Features:**
  - Passive subdomain collection: Retrieve subdomains from VirusTotal historical DNS data
  - Paginated queries: Supports retrieving large numbers of subdomains
  - IP association: Optionally include DNS resolution records
  - Deduplication: Automatically deduplicates returned results
  
  **Use Cases:**
  - Preliminary reconnaissance for security testing
  - Enterprise network asset discovery
  - Attack surface analysis
  - Threat intelligence collection
  - Penetration testing reconnaissance
  
  **Data Sources:**
  VirusTotal aggregates DNS data from multiple sources, including:
  - Historical DNS resolution records
  - Passive DNS databases
  - Certificate transparency logs
  - Security scan data
  
  **Notes:**
  - **API key required**: Register a VirusTotal account and obtain an API key
  - **Rate limits**: The free API is limited to 4 requests per minute
  - **Data freshness**: Data is based on historical scan records and may not be real-time
  - **Authorization**: Only query targets for which you have legal authorization
  - **Quota limits**: The free tier has a monthly query quota

parameters:
  - name: "domain"
    type: "string"
    description: |
      Target domain to query (required).
      
      **Format Requirements:**
      - Enter only the primary domain, without a protocol prefix (http://) or path
      - Second-level domain queries are supported
      
      **Example Values:**
      - "example.com"
      - "google.com"
      - "baidu.com"
      - "github.com"
      
      **Notes:**
      - The domain format must be valid
      - Query results may include cross-domain subdomains
    required: true
    position: 2
    format: "positional"
  
  - name: "limit"
    type: "int"
    description: |
      Maximum number of results to return (optional).
      
      **Details:**
      - Default: 40
      - Maximum: 1000 (API limit)
      - Recommended: 100-500
      
      **Notes:**
      - Setting an excessively large value may cause request timeouts
      - The API returns at most 40 items per request; larger requests are paginated automatically
    required: false
    position: 3
    format: "positional"
    default: 40
  
  - name: "include_ips"
    type: "bool"
    description: |
      Whether to include IP address information (optional).
      
      **Details:**
      - true: Include DNS resolution records in results
      - false: Return only the subdomain list
      
      **Notes:**
      - Including IP information increases the number of API calls
      - Historical resolved IPs may be included and may not be accurate
    required: false
    position: 4
    format: "positional"
    default: false
