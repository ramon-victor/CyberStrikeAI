name: "gau"
command: "gau"
enabled: true
short_description: "Collect all URLs from multiple data sources"
description: |
  Gau (Get All URLs) collects all URLs for a target domain from multiple data sources.

  **Features:**
  - Fetch URLs from the Wayback Machine
  - Fetch URLs from Common Crawl
  - Fetch URLs from OTX
  - Fetch URLs from URLScan

  **Use cases:**
  - URL discovery
  - Historical URL collection
  - Bug-bounty reconnaissance
  - Security testing
parameters:
  - name: "domain"
    type: "string"
    description: "Target domain"
    required: true
    position: 0
    format: "positional"
  - name: "providers"
    type: "string"
    description: "Data sources (wayback, commoncrawl, otx, urlscan)"
    required: false
    flag: "--providers"
    format: "flag"
  - name: "include_subs"
    type: "bool"
    description: "Include subdomains"
    required: false
    flag: "--subs"
    format: "flag"
    default: true
  - name: "additional_args"
    type: "string"
    description: |
      Additional Gau arguments for options not defined in this parameter list.

      **Examples:**
      - "--o output.txt": write to a file
      - "--threads 4": thread count
      - "--blacklist ttf,woff,svg,png": extension blacklist

      **Notes:**
      - Separate multiple arguments with spaces
      - Validate the format to avoid command injection
      - These arguments are appended directly to the command
    required: false
    format: "positional"
