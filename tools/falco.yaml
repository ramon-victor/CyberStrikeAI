name: "falco"
command: "falco"
enabled: true
short_description: "Runtime security monitoring tool"
description: |
  Falco is a runtime security monitoring tool used for detecting abnormal behavior, syscall anomalies, and security events in containers and host systems.

  **Falco CLI Usage for AI / Assistant:**
  - **Rule Validation**: `falco -r /etc/falco/falco_rules.yaml -V` (validate syntax of Falco rule files)
  - **Live Runtime Detection (No Driver / Userspace mode)**: `falco -r /etc/falco/falco_rules.yaml -o engine.kind=nodriver` (run without kernel module)
  - **Modern eBPF Engine**: `falco -o engine.kind=modern_ebpf` (use eBPF probe for kernel event capture)
  - **Replay Scap Trace File**: `falco -e /path/to/tracefile.scap` (analyze saved capture file for threats)
  - **JSON Output**: `falco -o json_output=true -o json_include_output_property=true` (structured output for downstream automation)

  **Key Features:**
  - Syscall runtime event capture & rule evaluation
  - Detection of privilege escalation, shell spawns, sensitive file access, and container drift
  - Real-time alerting with configurable severity levels (Emergency to Informational)
parameters:
  - name: "config_file"
    type: "string"
    description: "Falco configuration file"
    required: false
    flag: "--config"
    format: "flag"
    default: "/etc/falco/falco.yaml"
  - name: "rules_file"
    type: "string"
    description: "Custom rules file"
    required: false
    flag: "--rules"
    format: "flag"
  - name: "json_output"
    type: "bool"
    description: "Output in JSON format (equivalent to -o json_output=true)"
    required: false
    flag: "-o json_output=true"
    format: "flag"
    default: true
  - name: "duration"
    type: "int"
    description: "Monitoring duration (seconds)"
    required: false
    flag: "--duration"
    format: "flag"
    default: 60
  - name: "additional_args"
    type: "string"
    description: |
      Additional falco parameters. Used to pass falco options not defined in the parameter list.

      **Example Values：**
      - Add common parameter examples based on the tool

      **Notes：**
      - Separate multiple parameters with spaces
      - Ensure correct parameter format to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
