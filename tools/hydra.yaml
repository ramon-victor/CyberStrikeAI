name: "hydra"
command: "hydra"
args: ["-I"]
enabled: true
short_description: "Password-auditing tool supporting multiple protocols and services"
description: |
  Hydra is a network login password-auditing tool supporting SSH, FTP, HTTP, SMB, and other protocols.

  **Invocation requirements (read first):**
  - Provide a **username**: at least one of `username` (-l) or `username_file` (-L)
  - Provide a **password source**: `password` (-p), `password_file` (-P), or `-C` through `additional_args`
  - **Start with a small wordlist** (tens to hundreds of entries), confirm reachability, then expand; never default to huge lists such as rockyou
  - Defaults: stop on first match (-f), four parallel tasks (-t), ignore restore (-I); set `output_file` for long jobs

  **CLI order:** `hydra [options] <target> <service>` (this tool assembles arguments in this order)

  **Use cases:** weak-password detection and password-strength assessment in authorized environments

  **Note:** use only against authorized targets; reduce `wait_time` or the wordlist for unresponsive targets to avoid hanging.
parameters:
  - name: "username"
    type: "string"
    description: "Single username (-l); provide this or username_file"
    required: false
    flag: "-l"
    format: "flag"
  - name: "username_file"
    type: "string"
    description: "Username wordlist file (-L)"
    required: false
    flag: "-L"
    format: "flag"
  - name: "password"
    type: "string"
    description: "Single password (-p)"
    required: false
    flag: "-p"
    format: "flag"
  - name: "password_file"
    type: "string"
    description: "Password wordlist (-P); start with a small list"
    required: false
    flag: "-P"
    format: "flag"
  - name: "stop_on_first"
    type: "bool"
    description: "Exit after finding valid credentials (-f, default true)"
    required: false
    flag: "-f"
    format: "flag"
    default: true
  - name: "tasks"
    type: "int"
    description: "Parallel connections per target (-t); 4 is recommended for SSH and is the default"
    required: false
    flag: "-t"
    format: "flag"
    default: 4
  - name: "wait_time"
    type: "int"
    description: "Seconds to wait for each connection (-w), default 16"
    required: false
    flag: "-w"
    format: "flag"
    default: 16
  - name: "wait_between"
    type: "int"
    description: "Seconds between connections per thread (-W), default 1"
    required: false
    flag: "-W"
    format: "flag"
    default: 1
  - name: "output_file"
    type: "string"
    description: "Write results to a file (-o); recommended for long jobs"
    required: false
    flag: "-o"
    format: "flag"
  - name: "target"
    type: "string"
    description: "Target IP, hostname, or CIDR (must follow options)"
    required: true
    position: 1
    format: "positional"
  - name: "service"
    type: "string"
    description: "Service type (ssh, ftp, http-get, http-post-form, smb, etc.; see hydra -h)"
    required: true
    position: 2
    format: "positional"
  - name: "additional_args"
    type: "string"
    description: "Additional arguments such as -s port, -S SSL, -m module options, or -C login:pass file; appended at the end"
    required: false
    format: "positional"
