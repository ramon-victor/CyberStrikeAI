# ============================================
# CyberStrikeAI configuration file
# ============================================
# This configuration file supports visual configuration through the web UI
# Click the Settings button in the upper-right corner to change settings
# ============================================

# ============================================
# System settings
# ============================================

# Version shown in the frontend (optional; uses the default version when empty)
version: "v1.6.51"
# Server settings
server:
  host: 0.0.0.0 # Listen address; 0.0.0.0 means all interfaces
  port: 7022 # Service port; without TLS, use http://localhost:7022
  # --- Optional: HTTPS + HTTP/2 (reduces browser same-origin HTTP/1.1 connection limits and makes multiple Deep streams more stable)---
  # TLS is enabled when any of these is true: tls_enabled: true, or tls_auto_self_sign: true, or both tls_cert_path and tls_key_path are configured.
  # After enabling, visit https://127.0.0.1:<this-port>/. If you still use http:// to access the same port, you will be automatically redirected to HTTPS with 308 (set tls_http_redirect: false to disable).
  tls_enabled: true
  # When HTTPS is enabled, redirect plaintext HTTP to HTTPS automatically (default true; the same port sniffs TLS/HTTP and routes)
  # tls_http_redirect: true
  # Option A (recommended for production): PEM certificate and private key paths
  # tls_cert_path: /path/to/fullchain.pem
  # tls_key_path: /path/to/privkey.pem
  # Option B (local/test only): in-memory self-signed certificate when no certificate file is provided (browsers warn as untrusted; SAN includes localhost / 127.0.0.1)
  tls_auto_self_sign: true
# Authentication settings
auth:
  password:  # Web login password; change this to a strong password
  session_duration_hours: 12 # Login validity period in hours; users must sign in again after timeout
# Logging settings
log:
  level: info # Log level: debug, info, warn, error
  output: stdout # Log output destination: stdout, stderr, or a file path
# Platform operation audit (Settings → Audit Log; does not record conversation text or individual tool calls)
audit:
  enabled: true
  retention_days: 15 # 0 means do not auto-cleanup
  max_detail_bytes: 8192
  auth_failure_cooldown_seconds: 60 # 同一 IP 登录/password changes失败审计最短间隔（seconds）；未配置whendefault 60；-1 disabled节流
# MCP state-monitor execution record retention (tool_executions table)
monitor:
  retention_days: 90 # default when omitted 90；0 means do not auto-cleanup
# ============================================
# Conversation settings
# ============================================

# AI model settings (supports OpenAI-compatible APIs)
# 必填项：api_key, base_url, model 必须填写才能正常运行
# 支持 API 服务商：
#   - OpenAI: https://api.openai.com/v1
#   - DeepSeek: https://api.deepseek.com/v1
#   - 其他compatible with OpenAI protocol API
# 常用模型: gpt-4, gpt-3.5-turbo, deepseek-chat, claude-3-opus 等
# provider: 可选value openai(default) | claude(自动桥接到 Anthropic Claude Messages API)
openai:
  provider: openai # API 提供商: openai(default,compatible withOpenAIprotocol) | claude(自动桥接到Anthropic Claude Messages API)
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1 # API 基础 URL（必填）
  api_key: sk-xxxxxxx # API 密钥（必填）
  model: qwen3-max # Model name（必填）
  max_total_tokens: 120000 # LLM 相关上下文最大 Token 数限制（内存压缩和攻击链构建会共用此配置）
  # Eino 路径模型推理：DeepSeek/OpenAI 为 thinking / reasoning_effort；Claude 4.6+ 为 adaptive + output_config.effort（仅explicit配置 effort when下发）；3.7 为 enabled+budget_tokens:10000（文档示例），effort 不映射，自定义预算用 extra_request_fields
  reasoning:
    mode: on # auto | on | off；off when不附加任何推理扩展field
    effort: high # low | medium | high | max | xhigh（最高档：OpenAI 常用 xhigh，部分网关用 max，原样下发）；emptytable示不指定
    allow_client_reasoning: true # false when忽略对话request body reasoning，仅以下方为准
    profile: openai_compat # auto | deepseek_compat | openai_compat | output_config_effort
    # extra_request_fields: {} # 可选：管理员自定义根级 JSON 片段（高级）
# 视觉分析（analyze_image MCP 工具；图片仅在单次 VL 调用中出现，Agent 上下文只保留文字摘要）
vision:
  enabled: false # true 且 model 非emptywhen注册 analyze_image
  model: qwen-vl # VL 模型名（enabled when必填）
  api_key: "" # empty则复用 openai.api_key
  base_url: "" # empty则复用 openai.base_url
  provider: # empty则复用 openai.provider（openai | claude）
  max_image_bytes: 5242880 # 原始文件上限（bytes），default 5MB
  max_dimension: 2048 # 长边缩放像素
  jpeg_quality: 82
  max_payload_bytes: 524288 # 编码后送 VL API 上限，default 512KB
  skip_preprocess_below_bytes: 2097152 # 低于 2MB 且长边<=max_dimension 且<=max_payload when原图直传；0=始终压缩
  detail: auto # low | high | auto（Eino ImageURLDetail）
  timeout_seconds: 60
# ============================================
# 信息收集（FOFA）配置（可选）
# ============================================
# 用于「信息收集」page调用 FOFA API（后端agent，避免前端暴露 key）
# 也viaenvironment variable配置：FOFA_EMAIL / FOFA_API_KEY（优先级更高）
fofa:
  base_url: https://fofa.info/api/v1/search/all # 可选，empty则usedefault
  email: "" # FOFA 账号邮箱（可选，建议在系统设置中填写）
  api_key: "" # FOFA API Key（可选，建议在系统设置中填写）
# Agent 配置
# 达到最大迭代次数when，AI 会自动总结测试结果
agent:
  max_iterations: 12000 # 全局最大迭代次数（单agent / Deep / Supervisor / Plan-Execute 主执行器 / sub-agents均沿用；agents/*.md 中 max_iterations>0 可单独overridden by）
  tool_timeout_minutes: 60 # 单次工具执行最大when长（分钟），timeout自动终止；0 table示不限制（不推荐，易出现长when间挂起）
  shell_no_output_timeout_seconds: 1200 # execute/exec 连续无新输出则终止（seconds）；通用防挂死；0=default300；-1=disabled
  workspace_root_dir: "" # 会话工作目录根路径（curl/wget 下载、read_file/glob/grep local分析）；empty=tmp/workspace，其下by projects/{id} 或 conversations/{id} 隔离；勿用系统 /tmp
  # system_prompt_path: prompts/single-agent.md # 可选：单agent系统提示文件（相对本配置文件所在目录）；非empty且可读when替换内置提示

  system_prompt_path: ""
# 人机协同（HITL）全局allowlist：此处listed工具始终免审批，and对话页「allowlist工具（免审批，逗号分隔）」merged为并集；侧栏「应用」可merged写入本列table并立i.e.生效。
# 非allowlist工具在审批方=审计 Agent when，by会话 HITL 模式选用提示词：
#   approval → audit_agent_prompt
#   review_edit → audit_agent_prompt_review_edit（可改参后放行）
hitl:
  # 全局default审批方：human=人工审批，audit_agent=审计 Agent；未选会话when切换会写入本项，重启后仍生效
  default_reviewer: human
  # 已决策审计日志保留天数（and MCP 监控一致；省略default 90；0 means do not auto-cleanup）
  retention_days: 90
  # by你环境里真实tool name增删（and侧栏一致、小写不敏感）；不需要全局免审批可改为 []
  tool_whitelist: [read_file, list_dir, glob, grep, tool_search]
  # audit_agent_prompt: |  # 审批模式；emptyuse内置default，can be in「人机协同」页编辑
  # audit_agent_prompt_review_edit: |  # 审查编辑模式；emptyuse内置default

  audit_agent_prompt: |-
    你是 CyberStrikeAI 人机协同审计 Agent。审查 Agent i.e.将执行工具调用是否会对系统造成实质性损害。

    你会收到 JSON，包含 hitlMode、toolName、arguments/argumentsObj、userMessage、thinking、reasoningChain、planning 等field。

    裁决基调（default放行）：
    - 常规、低风险渗透测试操作 → approve（e.g.信息收集、端口/服务scan、目录枚举、只读查询、无害探测命令）
    - and用户授权、when前任务目标一致，且未见明确高危迹象 → approve
    - 仅在「可能对系统造成实质影响」when → reject

    必须 reject 高危情形（示例，非穷举）：
    - 删库、清table、批量删除数据、format化磁盘、不可逆破坏
    - 修改/重置密码、创建或篡改管理员账号、持久化后门、开机自启
    - 向生产环境写入恶意载荷、勒索加密、停止关key服务、修改系统核心配置
    - 明显越权：and任务/授权目标无关破坏性操作

    不应单独作为 reject 理by情形：
    - 常规 nmap/curl/grep/读文件/枚举类命令本身
    - arguments略显宽泛但无明确破坏意图
    - 仅因「信息不足」——若无上述高危迹象，应 approve 并can be in comment 中提示注意点

    仅输出一行 JSON，不要 markdown code块：
    {"decision":"approve"|"reject","comment":"简要理by"}
  audit_agent_prompt_review_edit: |-
    你是 CyberStrikeAI 人机协同审计 Agent。审查 Agent i.e.将执行工具调用是否会对系统造成实质性损害。

    你会收到 JSON，包含 hitlMode、toolName、arguments/argumentsObj、userMessage、thinking、reasoningChain、planning 等field。

    裁决基调（default放行）：
    - 常规、低风险渗透测试操作 → approve（e.g.信息收集、端口/服务scan、目录枚举、只读查询、无害探测命令）
    - and用户授权、when前任务目标一致，且未见明确高危迹象 → approve
    - 仅在「可能对系统造成实质影响」when → reject；arguments可安全收窄when优先 approve + editedArguments

    必须 reject 高危情形（示例，非穷举）：
    - 删库、清table、批量删除数据、format化磁盘、不可逆破坏
    - 修改/重置密码、创建或篡改管理员账号、持久化后门、开机自启
    - 向生产环境写入恶意载荷、勒索加密、停止关key服务、修改系统核心配置
    - 明显越权：and任务/授权目标无关破坏性操作

    不应单独作为 reject 理by情形：
    - 常规 nmap/curl/grep/读文件/枚举类命令本身
    - arguments略显宽泛但无明确破坏意图（应收窄arguments后 approve）
    - 仅因「信息不足」——若无上述高危迹象，应 approve 并can be in comment 中提示注意点

    仅输出一行 JSON，不要 markdown code块：
    {"decision":"approve"|"reject","comment":"简要理by","editedArguments":{...}}

    editedArguments 规则（仅 approve 且需要改参when填写，否则省略该field）：
    - 提供完整替换后工具arguments对象，key名and argumentsObj 一致
    - 只做最小必要修改以收窄范围、消除风险（e.g.限制 path、去掉危险 flag）
    - forbidden扩大攻击面：不得扩大目标范围、提升权限或引入破坏性arguments
    - 无法安全改参且存在上述高危情形when应 reject，不要勉强 approve
# 多agentand Eino 单agent（CloudWeGo Eino ADK；单agent入口 /api/eino-agent*，多agent /api/multi-agent*）
# 依赖在 go.mod 中拉取；若下载失败可设置: go env -w GOPROXY=https://goproxy.cn,direct
# Deep / Plan-Execute / Supervisor by对话页and WebShell 所选模式在request body orchestration 中指定；robotby robot_default_agent_mode
multi_agent:
  enabled: true
  robot_default_agent_mode: eino_single # 企微/DingTalk/Larkrobotdefault：eino_single | deep | plan_execute | supervisor
  batch_use_multi_agent: false # true when「批量任务」队列中every个子任务也goes through Eino 多agent（成本更高）
  # plan_execute 专用：execute↔replan 外层循环上限，0 table示 Eino default 10。主/sub-agents ReAct 轮次见 agent.max_iterations。
  plan_execute_loop_max_iterations: 0
  sub_agent_user_context_max_runes: 0 # sub-agents task 描述中注入用户原文；0=不截断（default），>0=总字符上限，负数=disabled
  without_general_sub_agent: false # false when保留 Deep 内置 general-purpose sub-agents
  without_write_todos: false
  orchestrator_instruction: "" # Deep main agent：agents/orchestrator.md（或 kind: orchestrator 单个 .md）正文优先；正文when empty用此处；皆empty则 Eino default
  orchestrator_instruction_plan_execute: "" # plan_execute main agent：agents/orchestrator-plan-execute.md 正文优先；正文when empty用此处；皆empty则用内置 plan_execute 提示（不use Deep  orchestrator_instruction）
  orchestrator_instruction_supervisor: "" # supervisor main agent：agents/orchestrator-supervisor.md 正文优先；正文when empty用此处；皆empty则用内置 supervisor 提示（transfer/exit 说明仍by运行追加；不use Deep  orchestrator_instruction）
  # Eino 官方 Skills：渐进式披露 + 可选本机文件/Shell（eino-ext local backend）。Skills 目录见 skills_dir。
  eino_skills:
    disable: false # true：不注册 skill 渐进式披露中间件，也不挂本机 FS/Shell 工具；false：by下方toggleload
    filesystem_tools: true # true：注册 read_file/glob/grep/write/edit/execute（授权环境慎用）；false：仅 skill，不暴露本机读写and Shell
    skill_tool_name: skill # 模型侧可调用「loadskills」tool name，一般保持 skill；andskills包文档中调用名一致i.e.可
  # Eino ADK 中间件and Deep/Supervisor/plan_execute Executor 调参（结构体见 internal/config/config.go → MultiAgentEinoMiddlewareConfig）
  # plan_execute：下列 patch/reduction/tool_search/plantask 等同样作用于 Executor（经 ExecPreMiddlewares）；Planner/Replanner 不挂 MCP 前置中间件。
  eino_middleware:
    patch_tool_calls: true # true：修补历史中无 tool_result 悬empty tool_call（流式中断/重试后更稳）；false：disabled；fielddefault when omitted等同 true
    tool_search_enable: true # true：工具数 ≥ min whenenabled tool_search，仅前 N 个工具常驻，其余by正则by需解锁，省 token、减误选；false：全量工具进上下文
    tool_search_min_tools: 20 # 达到该数量才enabled tool_search（避免工具很少when多此一举）；and always_visible 配合use
    tool_search_always_visible: 12 # 始终直接暴露给模型工具个数（顺序and角色工具列table一致）；其余工具进入动态池，需 tool_search 解锁
    tool_search_always_visible_tools: [read_file, glob, grep, analyze_image, write_file, edit_file, execute, task, transfer_to_agent, exit, write_todos, skill, tool_search, TaskCreate, TaskGet, TaskUpdate, TaskList, record_vulnerability, list_vulnerabilities, get_vulnerability, list_knowledge_risk_types, search_knowledge_base, webshell_exec, webshell_file_list, webshell_file_read, webshell_file_write, manage_webshell_list, manage_webshell_add, manage_webshell_update, manage_webshell_delete, manage_webshell_test, batch_task_list, batch_task_get, batch_task_start, batch_task_rerun, batch_task_pause, batch_task_update_metadata, batch_task_update_schedule, batch_task_schedule_enabled, batch_task_update_task, batch_task_remove_task, batch_task_delete, batch_task_create, batch_task_add_task, http-framework-test, exec] # 后端内置常驻工具allowlist（优先于 always_visible 数量策略）
    plantask_enable: true # P0：main agent挂载 TaskCreate/Get/Update/List 结构化任务板；需 eino_skills available且 skills_dir 存在
    plantask_rel_dir: .eino/plantask # 任务文件相对 skills_dir，by会话分子目录：skills/.eino/plantask/<conversationId>/
    reduction_enable: true # true：大工具输出截断/落盘以控上下文；依赖and plantask 相同 eino local 写盘后端，无后端when不挂载
    reduction_max_length_for_trunc: 50000 # 单条工具结果超过该字符数（bytes）when截断并落盘（by reduction 中间件to process）
    reduction_max_tokens_for_clear: 160000 # 历史工具结果清理阈value（tokens），超阈valuewhen在模型调用前清理旧结果
    reduction_root_dir: "" # 非empty：截断/清理内容落盘根路径；empty：use系统临when目录下by会话隔离default路径
    reduction_clear_exclude: [] # 不参and「清理阶段」tool name额外列table（will be merged with task/transfer/exit 等内置排除项merged）；需要when用 YAML 列table填写
    reduction_sub_agents: true # true：sub-agents也挂 reduction；false：仅编排main agentuse reduction
    summarization_trigger_ratio: 0.8 # summarization 触发比例（max_total_tokens * ratio），建议 0.75~0.85
    summarization_emit_internal_events: true # true：发出 summarization 内部事件（便于诊断）
    plan_execute_user_input_budget_ratio: 0.35 # plan_execute 中 userInput 预算比例（planner/replanner/executor 共用）
    plan_execute_executed_steps_budget_ratio: 0.2 # plan_execute 中 executed_steps 预算比例
    plan_execute_max_step_result_runes: 4000 # plan_execute everysteps结果最大字符数（超出截断）
    plan_execute_keep_last_steps: 8 # plan_execute 仅保留最近 N steps正文，早期steps骤折叠为标题
    checkpoint_dir: data/eino-checkpoints # P0：process崩溃/OOM 后同会话自动 ADK Resume；正常结束会删 .ckpt；and「中断并继续」(last_react_*) 是两套机制
    run_retry_max_attempts: 0 # 429/5xx/网络抖动when可退避重试次数（run loop + summarization 共用 isEinoTransientRunError）；0=default 10
    run_retry_max_backoff_sec: 0 # 单次退避上限seconds数；0=default 30
    empty_response_continue_max_attempts: 0 # Run 成功但未捕获助手正文（含流式中断）when Handler 退避续跑次数；0=default 5
    deep_output_key: final_answer # P0：Eino session 写入最终助手结论（框架内部；Deep/Supervisor 主/eino_single）
    deep_model_retry_max_retries: 0 # 已废弃，请用 run_retry_max_attempts；保留field仅为compatible with旧配置
    task_tool_description_prefix: "" # 非empty：仅 Deep  task 工具use自定义描述前缀，运行when会拼接sub-agents名称；empty则goes through Eino default生成逻辑
  # Eino callbacks + OpenTelemetry：框架级 span（and Zap 对齐）；default不向终端用户 UI 推 eino_trace_*（见 sse_trace_to_client）
  eino_callbacks:
    enabled: true
    # log_only=仅 Zap+OTel（推荐default）| sse/full=才enabled流式回调副本disabled等（full 含 stream hooks）
    mode: log_only
    sse_trace_to_client: false # true：且 mode 为 sse/full when，向前端when间线推送 eino_trace_*（排障/内网演示用）
    max_input_summary_runes: 400
    max_output_summary_runes: 400
    zap_verbose: false # true：Debug 附带 input/output 摘要
    otel:
      enabled: true
      service_name: cyberstrike-ai
      exporter: stdout # none | stdout（开发/本机）| otlphttp（生产接 Collector）
      otlp_endpoint: localhost:4318 # otlphttp use，host:port，路径固定 /v1/traces
      sample_ratio: 1.0 # 0~1，ParentBased+TraceIDRatio
# 数据库配置
database:
  path: data/conversations.db # SQLite 数据库文件路径，用于存储对话历史和消息
  knowledge_db_path: data/knowledge.db # 知识库数据库文件路径（可选，为empty则use会话数据库），用于存储知识库项和向量嵌入，可独立复制和复用
# ============================================
# 任务管理相关配置
# ============================================
# （配置项已包含在Conversation settings配置中）

# ============================================
# 漏洞管理相关配置
# ============================================

# 安全工具配置
# the system loads all .yaml format tool configs文件
# 推荐方式：在 tools/ 目录下为every个工具创建独立配置文件
security:
  tools_dir: tools # 工具配置文件目录（relative to the config file's directory）
  # 工具描述模式：load tools 下工具when，暴露给 AI/API use描述来源
  #   short - 优先use short_description（简短描述，省 token），when empty用 description
  #   full  - use description（详细描述）
  tool_description_mode: full
# ============================================
# MCP 相关配置
# ============================================

# MCP protocol配置
# MCP (Model Context Protocol) 用于工具注册和调用
mcp:
  enabled: false # 是否enabled MCP servers器（http模式）
  host: 0.0.0.0 # MCP servers器监听地址
  port: 8081 # MCP server port
  auth_header: "X-MCP-Token" # auth：request需携带该 header 且valueand auth_header_value 一致方可调用。emptytable示不auth
  auth_header_value: "" # auth密钥value（and auth_header 配合use，建议use随机字符串）
# 外部 MCP 配置
external_mcp:
  servers: {}
# 内置 C2：本机仅做对话/知识库when可设为 false，不启动监听器、不注册 C2 MCP 工具；省略本段whendefaultenabled
c2:
  enabled: true
# ============================================
# 知识库相关配置
# ============================================
knowledge:
  enabled: false # 是否enabled知识检索功能
  base_path: knowledge_base # 知识库directory path（relative to the config file's directory）
  embedding:
    provider: openai # 嵌入模型提供商（目前仅支持openai）
    model: text-embedding-v4 # 嵌入Model name
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1 # empty则useOpenAI配置base_url
    api_key: sk-xxxxxxx # empty则useOpenAI配置api_key
  retrieval:
    top_k: 5 # 检索返回Top-K结果数量
    similarity_threshold: 0.4 # 余弦相似度阈value（0-1），低于此value结果将被过滤
    # Eino MultiQuery：LLM 改写查询后多路向量检索再融合（始终enabled）
    multi_query:
      max_queries: 4 # 改写变体上限（含语义overridden by）；建议 3~4
    # 精排（始终enabled）：dashscope 用 gte-rerank；其他 OpenAI compatible endpointgoes through /v1/rerank
    rerank:
      provider: "" # empty=by base_url 推断：dashscope | cohere
      model: "" # empty=dashscope→gte-rerank，cohere→rerank-multilingual-v3.0
      base_url: "" # empty则用 embedding / openai  base_url
      api_key: "" # empty则用 embedding / openai  api_key
    post_retrieve:
      prefetch_top_k: 20 # every条 MultiQuery 变体向量候选数；0=内置 max(top_k*4,20)
      max_context_chars: 0 # 0 不限制；否则返回正文总 Unicode 字符上限（整段 chunk）
      max_context_tokens: 0 # 0 不限制；tiktoken 总 token 上限
    sub_index_filter: ""
  # ============================================
  # 索引配置（用于解决 API 限制问题）
  # ============================================
  indexing:
    # 分块配置
    chunk_size: 512 # every个块最大 token 数（default 512），长文本会被分割成multiple块
    chunk_overlap: 50 # 块之间重叠 token 数（default 50），保持上下文连贯性
    max_chunks_per_item: 0 # 单个知识项最大块数量（0 table示不限制），防止单个文件消耗过多 API 配额
    # 速率限制配置（解决 429 错误）
    max_rpm: 0 # every分钟最大request数（default 0 table示不限制），e.g. OpenAI default 200 RPM
    rate_limit_delay_ms: 300 # request间隔毫seconds数（default 300），用于避免 API 速率限制，设为 0 不限制
    # 建议value：200 次/分钟≈300ms, 100 次/分钟≈600ms

    # 重试配置
    max_retries: 3 # 最大重试次数（default 3），遇到速率限制或服务器错误when自动重试
    retry_delay_ms: 1000 # 重试间隔毫seconds数（default 1000），every次重试会递增延迟
    # 分块策略（Eino）：markdown_then_recursive = 先by Markdown 标题切再递归；recursive = 仅递归切分。emptywhen程序内default markdown_then_recursive
    chunk_strategy: markdown_then_recursive
    # 嵌入 HTTP requesttimeout（seconds）。0 table示use内置default（一般为 120），and向量化 API 客户端一致
    request_timeout_seconds: 120
    # true：索引when优先用知识项 file_path 指向磁盘文件内容（Eino FileLoader）；false：用数据库里存正文。读盘失败会回退 DB
    prefer_source_file: false
    # 单次嵌入 API request文本条数上限（索引写入by此分批）。须 ≤ 服务商限制（e.g.部分compatible with接口最多 10）；过大易 400
    batch_size: 10
    # Eino indexer.WithSubIndexes：逻辑分区标签列table，会写入向量table sub_indexes，检索available sub_index_filter 过滤；无需求可 []
    sub_indexes: []
# ============================================
# robot配置（WeCom、DingTalk、Lark）
# ============================================
# 用于在手机端通过WeCom/DingTalk/Larkand CyberStrikeAI 对话，无需部署在服务器上也可use
# 在系统设置 -> robot设置 中可配置
robots:
  wechat: # 微信 iLink（个人微信 ClawBot，扫码绑定）
    enabled: false
    bot_token: ""
    ilink_bot_id: ""
    ilink_user_id: ""
    base_url: https://ilinkai.weixin.qq.com
    bot_type: "3"
    bot_agent: CyberStrikeAI/1.0
  wecom: # WeCom
    enabled: false
    token: ""
    encoding_aes_key: ""
    corp_id: ""
    secret: ""
    agent_id: 0
  dingtalk: # DingTalk
    enabled: false
    client_id: ""
    client_secret: ""
    allow_conversation_id_fallback: false
  lark: # Lark
    enabled: false
    app_id: ""
    app_secret: ""
    verify_token: ""
    allow_chat_id_fallback: false
# ============================================
# Skills 相关配置
# ============================================

# skills包目录：every个子目录仅标准 SKILL.md（Agent Skills：front matter 仅 name、description）+ 可选附属文件；无 SKILL.yaml
# 示例：skills/cyberstrike-eino-demo/
skills_dir: skills # Skills配置文件目录（relative to the config file's directory）
# ============================================
# 多agent子 Agent（Markdown，唯一维护处）
# ============================================
# every个 .md：YAML front matter（name / id / description / tools / bind_role / 可选 max_iterations>0 overridden by全局 / 可选 kind: orchestrator）+ 正文为系统提示词
# main agent：固定文件名 orchestrator.md，或任意文件名 + front matter kind: orchestrator（全目录仅allowed一个）；main agent is not part of task sub-agent list
# Advanced usage：仍can be in multi_agent block within sub_agents，will be merged withthe .md files in this directoryand the same id when YAML can be overridden by .md overridden by
agents_dir: agents
# ============================================
# Role settings
# ============================================

# the system loads all .yaml format role configuration files
# create a separate config file for each role，e.g.：roles/CTF.yaml, roles/default.yaml 等
roles_dir: roles # Role config files directory（relative to the config file's directory）

# ============================================
# Project management and fact blackboard
# ============================================
project:
  enabled: true
  # default_project_id: "" # 可选：default project when robot/batch tasks create conversations ID
  fact_index_max_runes: 65000
  # Fact-relations overview budget（reserved from the index total budget）
  fact_index_path_max_runes: 10000 
  fact_summary_max_runes: 24000
  default_inject_deprecated: false

